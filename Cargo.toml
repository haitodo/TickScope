[package]
name = "tick-scope"
version = "0.1.0"
edition = "2021"
default-run = "tick-scope"
authors = ["TickScope Team"]
description = "TickScope FX multi-broker real-time tick comparison and visualization application"

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
arc-swap = "1.7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
crc32fast = "1.4"
thiserror = "2.0"
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }


[[bin]]
name = "tick-scope"
path = "src/main.rs"

[lib]
name = "tick_scope"
path = "src/lib.rs"

