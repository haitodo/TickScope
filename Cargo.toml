[package]
name = "tick-scope"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
default-run = "tick-scope"
authors = ["TickScope Team"]
description = "TickScope FX multi-broker real-time tick comparison and visualization application"

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
arc-swap = "1.7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
crc32fast = "1.4"
thiserror = "2.0"
parking_lot = "0.12"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Optional replay dependencies (Zero overhead when not using --features replay)
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
arrow = { version = "53", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
futures-util = { version = "0.3", optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = []
replay = [
    "dep:parquet",
    "dep:arrow",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:chrono",
]

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }


[[bin]]
name = "tick-scope"
path = "src/main.rs"

[[bin]]
name = "tick-scope-replay"
path = "src/bin/replay.rs"
required-features = ["replay"]

[lib]
name = "tick_scope"
path = "src/lib.rs"

